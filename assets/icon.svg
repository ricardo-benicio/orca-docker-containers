<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b7bff"/>
      <stop offset="1" stop-color="#0b3fae"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cfe0ff"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- three stacked containers -->
  <g fill="url(#box)">
    <rect x="96"  y="120" width="320" height="82" rx="20"/>
    <rect x="96"  y="215" width="320" height="82" rx="20"/>
    <rect x="96"  y="310" width="320" height="82" rx="20"/>
  </g>
  <!-- status dots: running, running, stopped -->
  <circle cx="152" cy="161" r="16" fill="#22c55e"/>
  <circle cx="152" cy="256" r="16" fill="#22c55e"/>
  <circle cx="152" cy="351" r="16" fill="#9aa8c7"/>
  <!-- label bars -->
  <g fill="#0b3fae" opacity="0.28">
    <rect x="196" y="150" width="150" height="22" rx="11"/>
    <rect x="196" y="245" width="190" height="22" rx="11"/>
    <rect x="196" y="340" width="120" height="22" rx="11"/>
  </g>
</svg>
